name: Humanizer
options:
  bundleIdPrefix: com.brandon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Humanizer:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Humanizer
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        SUFeedURL: https://demonweaver.github.io/humanizer/appcast.xml
        SUPublicEDKey: 2BA/bbHaZ4yFRfhbDGjMjK5YbAV8aw9pITwETl4CyV8=
        SUEnableInstallerLauncherService: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Humanizer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon.humanizer
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LRUFMKU4V6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
