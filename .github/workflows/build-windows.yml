name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # required to attach the installer to the Release
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Keep the bundled skill in sync with the repo copy.
      - name: Sync SKILL.md
        run: copy ..\Resources\SKILL.md assets\SKILL.md
        shell: cmd

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npm run make-icons

      # On a tag: build AND publish to the matching GitHub Release. This
      # uploads the installer plus latest.yml + .blockmap that electron-updater
      # reads to auto-update existing installs.
      - name: Build & publish installer (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On manual runs: just build and upload an artifact (no publish).
      - name: Build installer (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Humanizer-Windows-Setup
          path: |
            windows/dist/*.exe
            windows/dist/latest.yml
            windows/dist/*.blockmap
